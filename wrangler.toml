name = "weight-tracker-bot"
main = "src/index.ts"
compatibility_date = "2024-01-29"

# D1 Database binding
# After creating D1 database, paste your database_id below
[[d1_databases]]
binding = "DB"
database_name = "telegram-bot-db"
database_id = "6026b4e7-c2c2-49fd-9112-e427d111500c"

# Cron triggers for scheduled reports
# Daily report: 21:00 Asia/Nicosia (18:00 UTC), Mon-Sat
# Weekly report: Sunday 21:00 Asia/Nicosia (18:00 UTC)
[triggers]
crons = ["0 18 * * MON-SAT", "0 18 * * SUN"]

# Environment variables (secrets)
# Set these via CLI:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put OWNER_USER_ID
#
# For local development, create .dev.vars file:
#   TELEGRAM_BOT_TOKEN=your_token_here
#   OWNER_USER_ID=123456789
